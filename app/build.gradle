plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jiseka.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.jiseka.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding true
        buildConfig true 
    }

    buildTypes {
        debug {
            buildConfigField "String", "VERCEL_URL", VERCEL_URL
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "VERCEL_URL", VERCEL_URL
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // ⭐️ [수정됨] 최신 AGP(8.0+) 규격에 맞게 aaptOptions를 androidResources로 변경
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'

    // CameraX 
    def camerax_version = "1.3.2"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // 💡 TensorFlow Lite Task Vision (직접 훈련한 번호판 탐지 AI 모델 구동용)
    implementation 'org.tensorflow:tensorflow-lite-task-vision:0.4.4'

    // 💡 구글 ML Kit (현재 AI 모델로 번호판 영역을 찾으므로 제외, 글자 인식이 다시 필요할 때 주석 해제)
    // implementation 'com.google.mlkit:text-recognition-korean:16.0.0'

    // 💡 OpenCV (번호판 정밀 모서리 탐지용)
    implementation 'com.quickbirdstudios:opencv:4.5.3.0'
    
    // 테스트 라이브러리
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
